<rect x="640" y="925" width="525" height="130" rx="8" fill="#1f2227" stroke="#353b44"/>
<rect x="640" y="925" width="525" height="30" rx="8" fill="#262a31"/><rect x="640" y="945" width="525" height="10" fill="#262a31"/>
<text x="658" y="946" font-size="12" font-weight="700" fill="#ee3124" letter-spacing="1">ANIMATED PACKETS, ONE PER SCENARIO</text>
<g font-size="13" fill="#f2f4f7"><circle cx="668" cy="972" r="7" fill="#35c7f0"/><text x="684" y="977">Policy route, forward</text><circle cx="668" cy="997" r="7" fill="#ff8c1a"/><text x="684" y="1002">Policy route, stop routing</text><circle cx="668" cy="1022" r="7" fill="#22c3b0"/><text x="684" y="1027">ISDB route match</text><circle cx="910" cy="972" r="7" fill="#f5c542"/><text x="926" y="977">SD-WAN rule match</text><circle cx="910" cy="997" r="7" fill="#8f8bff"/><text x="926" y="1002">FIB match</text><circle cx="910" cy="1022" r="7" fill="#ff5c5c"/><text x="926" y="1027">No route, dropped</text></g>
<text x="660" y="1045" font-size="11" fill="#9aa3ad">Dashed lines flow in the direction the lookup moves.</text>
<g filter="url(#glow)">
      <circle r="9" fill="#35c7f0" opacity="0">
      <animateMotion dur="12s" begin="0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.4;1" calcMode="linear"><mpath href="#p1"/></animateMotion>
