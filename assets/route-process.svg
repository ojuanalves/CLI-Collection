<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1080" width="1200" height="1080" font-family="Roboto, 'Segoe UI', system-ui, Arial, sans-serif">
  <title>FortiGate route lookup process</title>
  <style>
    .flow { fill: none; stroke-width: 3; stroke-dasharray: 10 8; animation: dash 1.2s linear infinite; }
    .lbl { font-size: 14px; font-weight: 700; }
    .cmd { font-family: Consolas, Menlo, "DejaVu Sans Mono", monospace; font-size: 14px; fill: #d6dde6; }
    .node { font-size: 16px; font-weight: 700; fill: #f2f4f7; text-anchor: middle; }
    .small { font-size: 12px; font-weight: 600; fill: #9aa3ad; text-anchor: middle; }
    .title { font-size: 26px; font-weight: 700; fill: #f2f4f7; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .pulse2 { animation-delay: .6s; } .pulse3 { animation-delay: 1.2s; } .pulse4 { animation-delay: 1.8s; }
    @keyframes dash { to { stroke-dashoffset: -36; } }
    @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: .95; transform: scale(1.05); } }
  </style>
  <defs>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="m7b8590" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8590"/></marker>
    <marker id="m2fbf71" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2fbf71"/></marker>
    <marker id="mff8c1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff8c1a"/></marker>
    <marker id="m5aa9ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa9ff"/></marker>
    <marker id="mff5c5c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff5c5c"/></marker>
    <marker id="m9aa3ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa3ad"/></marker>
